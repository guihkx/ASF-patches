name: Build artifacts
on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SDK_VERSION: 10.0.x
  PLUGINS: ArchiSteamFarm.OfficialPlugins.ItemsMatcher ArchiSteamFarm.OfficialPlugins.MobileAuthenticator

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
    - id: skip_check
      uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
      with:
        concurrent_skipping: 'same_content'
        skip_after_successful_duplicate: 'true'
        paths_ignore: '["**/*.md"]'
        do_not_skip: '["workflow_dispatch", "schedule"]'

  build:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: generic
          - os: ubuntu-latest
            target: linux-arm64
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win-x64

    defaults:
      run:
        shell: bash
        working-directory: ArchiSteamFarm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Fetch tags from ArchiSteamFarm
        run: |
          git fetch --recurse-submodules=no --tags

      - name: Setup variables
        id: vars
        run: echo "version=$(git describe --long)" >> $GITHUB_OUTPUT

      - name: Show ArchiSteamFarm version
        run: echo "$STEPS_VARS_OUTPUTS_VERSION"
        env:
          STEPS_VARS_OUTPUTS_VERSION: ${{ steps.vars.outputs.version }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Show .NET information
        run: dotnet --info

      - name: Show Node.js version
        run: node -v

      - name: Show npm version
        run: npm -v

      - name: Setup git
        run: |
          git config --global user.email 626206+guihkx@users.noreply.github.com
          git config --global user.name guihkx

      - name: Apply patches
        run: |
          for patch_file in $(realpath ../patches/*.patch)
          do
              git am --reject "$patch_file"
          done

      - name: Deploy ASF-ui
        working-directory: ArchiSteamFarm/ASF-ui
        run: |
          npm ci
          npm run-script deploy

      - name: Publish ArchiSteamFarm (${{ matrix.target }})
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          TARGET_OS: ${{ matrix.target == 'generic' && 'source' || matrix.target }}
        run: |
          EXTRA_BUILD_ARGS=()
          if [[ "$MATRIX_TARGET" != 'generic' ]]
          then
            EXTRA_BUILD_ARGS+=(-r "$TARGET_OS" "-p:ASFVariant=$TARGET_OS" -p:PublishSingleFile=true -p:PublishTrimmed=true -p:SelfContained=true)
          else
            EXTRA_BUILD_ARGS+=(-p:TargetLatestRuntimePatch=false -p:UseAppHost=false)
          fi
          dotnet publish ArchiSteamFarm -c Release -o "../builds/$MATRIX_TARGET" -p:ContinuousIntegrationBuild=true --nologo "${EXTRA_BUILD_ARGS[@]}"

      - name: Publish official plugins (${{ matrix.target }})
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          for plugin in ${{ env.PLUGINS }}
          do
              out_dir="../builds/$MATRIX_TARGET/plugins/$plugin"
              mkdir -p "$out_dir"
              dotnet publish "$plugin" -c Release -o "$out_dir" -p:ContinuousIntegrationBuild=true -p:TargetLatestRuntimePatch=false -p:UseAppHost=false --nologo
          done

      - name: Upload build artifacts (${{ matrix.target }})
        uses: actions/upload-artifact@v7
        with:
          name: ArchiSteamFarm_v${{ steps.vars.outputs.version }}-${{ matrix.target }}
          path: builds/${{ matrix.target }}
